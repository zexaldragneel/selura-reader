name: Bootstrap Selura Signing Key

# Run exactly once from main, after adding SELURA_SIGNING_PASSWORD as a
# GitHub Actions repository secret. Never publish a plaintext keystore.
on:
  workflow_dispatch:
  # One-time setup may also be started by committing this exact trigger
  # from the GitHub-connected development workflow. The key itself is created
  # only when absent, and the workflow refuses to regenerate it.
  push:
    branches: [main]
    paths:
      - android/signing/START_SIGNING_SETUP

permissions:
  contents: write
  actions: write

concurrency:
  group: selura-signing-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate and encrypt the permanent Android signing key
        env:
          SELURA_SIGNING_PASSWORD: ${{ secrets.SELURA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${#SELURA_SIGNING_PASSWORD}" -lt 24 ]; then
            echo "::error::Create a random secret named SELURA_SIGNING_PASSWORD with at least 24 characters."
            exit 1
          fi
          if [ -e android/signing/selura-release.jks.asc ]; then
            echo "::error::The permanent signing key already exists. Do not regenerate it."
            exit 1
          fi
          umask 077
          mkdir -p android/signing
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/selura-release.jks" \
            -storetype PKCS12 \
            -alias selura-release \
            -keyalg RSA -keysize 3072 -validity 12000 \
            -dname "CN=Selura, OU=Android, O=Selura, C=PH" \
            -storepass:env SELURA_SIGNING_PASSWORD \
            -keypass:env SELURA_SIGNING_PASSWORD
          printf '%s' "$SELURA_SIGNING_PASSWORD" |
            gpg --batch --yes --quiet --armor --symmetric \
              --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA256 \
              --pinentry-mode loopback --passphrase-fd 0 \
              --output android/signing/selura-release.jks.asc \
              "$RUNNER_TEMP/selura-release.jks"
          test -s android/signing/selura-release.jks.asc
          echo "::notice::Encrypted Android signing key generated. No plaintext key will be committed."
      - name: Commit only encrypted keystore to Selura repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f android/signing/selura-release.jks.asc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/signing/selura-release.jks.asc
          git diff --cached --name-only | grep -qx 'android/signing/selura-release.jks.asc'
          git commit -m "Initialize encrypted permanent Selura APK signing key"
          git push origin HEAD:main
          echo "::notice::Encrypted key committed. Future builds reuse this same signing certificate."
      - name: Start first signed Selura APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android-apk.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "::notice::First signed APK build dispatched. Check Build Android APK workflow."
      - name: Destroy temporary plaintext keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/selura-release.jks"
