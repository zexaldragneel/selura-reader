name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the latest build for a frequently updated feature PR, reducing
# queue time and Android runner usage. Main release builds are not cancelled.
concurrency:
  group: selura-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Verify committed Android project
        run: |
          ANDROID_GRADLE_FILE="$(find android/app -maxdepth 1 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | head -n 1)"
          test -n "$ANDROID_GRADLE_FILE"
          grep -q 'com.selura.reader' "$ANDROID_GRADLE_FILE"
          if grep -q 'com.selura.selura_reader' "$ANDROID_GRADLE_FILE"; then
            echo 'Legacy application ID is still present.' >&2
            exit 1
          fi
          grep -Rqs '^package com.selura.reader' android/app/src/main/kotlin android/app/src/main/java
          grep -q 'android:label="Selura"' android/app/src/main/AndroidManifest.xml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify Android storage plugin regression pin
        run: |
          set -euo pipefail
          flutter pub deps --json > "$RUNNER_TEMP/selura-deps.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          deps = json.loads((Path(os.environ["RUNNER_TEMP"]) / "selura-deps.json").read_text())
          installed = {package["name"]: package["version"]
                       for package in deps["packages"]}
          actual = installed.get("shared_preferences_android")
          expected = "2.4.28"
          print(f"Selura Android shared preferences implementation: {actual}")
          if actual != expected:
              raise SystemExit(
                  f"Blocked known JNI regression: expected {expected}, resolved {actual}"
              )
          PY
      - name: Analyze source
        run: flutter analyze
      - name: Test cover extraction
        run: flutter test
      # Before the permanent signing key is initialized, prove that Gradle
      # can compile a *release* build with a disposable key. This APK is
      # explicitly never uploaded or published.
      - name: Smoke-test Android release signing configuration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          if [ -f android/signing/selura-release.jks.asc ]; then
            echo "Permanent signing material exists; no throwaway signer required."
            exit 0
          fi
          export SELURA_SIGNING_PASSWORD
          SELURA_SIGNING_PASSWORD="$(openssl rand -hex 32)"
          export SELURA_KEYSTORE_PATH="$RUNNER_TEMP/selura-signing-smoke.jks"
          trap 'rm -f "$SELURA_KEYSTORE_PATH"' EXIT
          keytool -genkeypair -noprompt \
            -keystore "$SELURA_KEYSTORE_PATH" -storetype PKCS12 \
            -alias selura-release -keyalg RSA -keysize 3072 \
            -validity 365 -dname "CN=Selura CI Smoke Test, O=Selura" \
            -storepass:env SELURA_SIGNING_PASSWORD \
            -keypass:env SELURA_SIGNING_PASSWORD >/dev/null
          flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_PATH/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify build/app/outputs/flutter-apk/app-release.apk
          rm -f build/app/outputs/flutter-apk/app-release.apk
          echo "::notice::Disposable signer release build passed. APK discarded, never published."
      # Fail closed until one permanent keystore has been created and
      # encrypted by .github/workflows/bootstrap-signing.yml.
      - name: Unlock persistent release signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SELURA_SIGNING_PASSWORD: ${{ secrets.SELURA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SELURA_SIGNING_PASSWORD" ]; then
            echo "::error::Add the SELURA_SIGNING_PASSWORD repository secret. See android/signing/README.md"
            exit 1
          fi
          if [ ! -f android/signing/selura-release.jks.asc ]; then
            echo "::error::Run the Bootstrap Selura Signing Key workflow on main before publishing APKs."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/selura-signing"
          printf '%s' "$SELURA_SIGNING_PASSWORD" |
            gpg --batch --yes --quiet --pinentry-mode loopback \
              --passphrase-fd 0 --decrypt \
              --output "$RUNNER_TEMP/selura-signing/selura-release.jks" \
              android/signing/selura-release.jks.asc
          keytool -list -keystore "$RUNNER_TEMP/selura-signing/selura-release.jks" \
            -alias selura-release -storepass:env SELURA_SIGNING_PASSWORD >/dev/null
          echo "SELURA_KEYSTORE_PATH=$RUNNER_TEMP/selura-signing/selura-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SELURA_SIGNING_PASSWORD: ${{ secrets.SELURA_SIGNING_PASSWORD }}
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify APK certificate, package and version code
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_PATH"
          APKSIGNER="$(find "$SDK_PATH/build-tools" -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_PATH/build-tools" -name aapt | sort -V | tail -n 1)"
          AAPT2="$(find "$SDK_PATH/build-tools" -name aapt2 | sort -V | tail -n 1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -x "$APKSIGNER" ] || [ ! -s "$APK" ]; then
            echo "::error::Android APK or apksigner is missing."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/selura-apk-signature.txt"
          # Recent Android Build Tools label the signer "V2 Signer" rather than
          # the older "Signer #1"; accept either while still requiring SHA-256.
          grep -m1 -E 'Signer.*certificate SHA-256 digest: [0-9a-f]{64}' "$RUNNER_TEMP/selura-apk-signature.txt"

          if [ -x "$AAPT" ]; then
            "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/selura-apk-metadata.txt"
          elif [ -x "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK" > "$RUNNER_TEMP/selura-apk-metadata.txt"
          else
            echo "::error::Neither aapt nor aapt2 was found in Android SDK build-tools."
            exit 1
          fi
          grep -m1 -F "package: name='com.selura.reader' versionCode='$GITHUB_RUN_NUMBER'" "$RUNNER_TEMP/selura-apk-metadata.txt" ||
            { echo "::error::APK package identity or version code mismatch."; cat "$RUNNER_TEMP/selura-apk-metadata.txt" | head -n 20; exit 1; }
      - name: Upload signed APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: selura-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Delete decrypted signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/selura-signing"

  release:
    name: Publish direct APK
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: selura-signed-apk
          path: release
      - name: Rename APK
        run: mv release/app-release.apk release/selura.apk
      - name: Publish direct-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Immutable per-run tag prevents another in-flight PR workflow
            # from replacing the APK that has already passed device testing.
            TAG="test-pr-${{ github.event.pull_request.number }}-run-${{ github.run_number }}"
            TITLE="Selura PR #${{ github.event.pull_request.number }} · Build #${{ github.run_number }}"
            NOTES="Release-signed direct-install test APK from PR #${{ github.event.pull_request.number }}, Build #${{ github.run_number }}. Never replaces another run's APK."
          else
            TAG="dev-${{ github.run_number }}"
            TITLE="Selura Development Build #${{ github.run_number }}"
            NOTES="Release-signed Selura Android APK generated from main by GitHub Actions. Persistently signed; uses an incrementing Android version code."
          fi

          gh release create "$TAG" \
            "release/selura.apk#Selura Signed APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease
