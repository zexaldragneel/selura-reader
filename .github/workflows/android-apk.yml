name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Verify committed Android project
        run: |
          ANDROID_GRADLE_FILE="$(find android/app -maxdepth 1 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | head -n 1)"
          test -n "$ANDROID_GRADLE_FILE"
          grep -q 'com.selura.reader' "$ANDROID_GRADLE_FILE"
          if grep -q 'com.selura.selura_reader' "$ANDROID_GRADLE_FILE"; then
            echo 'Legacy application ID is still present.' >&2
            exit 1
          fi
          grep -Rqs '^package com.selura.reader' android/app/src/main/kotlin android/app/src/main/java
          grep -q 'android:label="Selura"' android/app/src/main/AndroidManifest.xml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Test cover extraction
        run: flutter test
      # Before the permanent signing key is initialized, prove that Gradle
      # can compile a *release* build with a disposable key. This APK is
      # explicitly never uploaded or published.
      - name: Smoke-test Android release signing configuration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          if [ -f android/signing/selura-release.jks.asc ]; then
            echo "Permanent signing material exists; no throwaway signer required."
            exit 0
          fi
          export SELURA_SIGNING_PASSWORD
          SELURA_SIGNING_PASSWORD="$(openssl rand -hex 32)"
          export SELURA_KEYSTORE_PATH="$RUNNER_TEMP/selura-signing-smoke.jks"
          trap 'rm -f "$SELURA_KEYSTORE_PATH"' EXIT
          keytool -genkeypair -noprompt \
            -keystore "$SELURA_KEYSTORE_PATH" -storetype PKCS12 \
            -alias selura-release -keyalg RSA -keysize 3072 \
            -validity 365 -dname "CN=Selura CI Smoke Test, O=Selura" \
            -storepass:env SELURA_SIGNING_PASSWORD \
            -keypass:env SELURA_SIGNING_PASSWORD >/dev/null
          flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_PATH/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify build/app/outputs/flutter-apk/app-release.apk
          rm -f build/app/outputs/flutter-apk/app-release.apk
          echo "::notice::Disposable signer release build passed. APK discarded, never published."
      # Fail closed until one permanent keystore has been created and
      # encrypted by .github/workflows/bootstrap-signing.yml.
      - name: Unlock persistent release signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SELURA_SIGNING_PASSWORD: ${{ secrets.SELURA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SELURA_SIGNING_PASSWORD" ]; then
            echo "::error::Add the SELURA_SIGNING_PASSWORD repository secret. See android/signing/README.md"
            exit 1
          fi
          if [ ! -f android/signing/selura-release.jks.asc ]; then
            echo "::error::Run the Bootstrap Selura Signing Key workflow on main before publishing APKs."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/selura-signing"
          printf '%s' "$SELURA_SIGNING_PASSWORD" |
            gpg --batch --yes --quiet --pinentry-mode loopback \
              --passphrase-fd 0 --decrypt \
              --output "$RUNNER_TEMP/selura-signing/selura-release.jks" \
              android/signing/selura-release.jks.asc
          keytool -list -keystore "$RUNNER_TEMP/selura-signing/selura-release.jks" \
            -alias selura-release -storepass:env SELURA_SIGNING_PASSWORD >/dev/null
          echo "SELURA_KEYSTORE_PATH=$RUNNER_TEMP/selura-signing/selura-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SELURA_SIGNING_PASSWORD: ${{ secrets.SELURA_SIGNING_PASSWORD }}
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify APK certificate, package and version code
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_PATH"
          APKSIGNER="$(find "$SDK_PATH/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_PATH/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK" | grep -m1 'Signer #1 certificate SHA-256 digest:'
          "$AAPT" dump badging "$APK" |
            grep -m1 -F "package: name='com.selura.reader' versionCode='$GITHUB_RUN_NUMBER'"
      - name: Upload signed APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: selura-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Delete decrypted signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/selura-signing"

  release:
    name: Publish direct APK
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: selura-signed-apk
          path: release
      - name: Rename APK
        run: mv release/app-release.apk release/selura.apk
      - name: Publish direct-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="test-pr-${{ github.event.pull_request.number }}"
            TITLE="Selura Test PR #${{ github.event.pull_request.number }}"
            NOTES="Release-signed direct-install test APK for Pull Request #${{ github.event.pull_request.number }}. Built by GitHub Actions run #${{ github.run_number }}."
            gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && \
              gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          else
            TAG="dev-${{ github.run_number }}"
            TITLE="Selura Development Build #${{ github.run_number }}"
            NOTES="Release-signed Selura Android APK generated from main by GitHub Actions. Persistently signed; uses an incrementing Android version code."
          fi

          gh release create "$TAG" \
            "release/selura.apk#Selura Signed APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease
