name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Ensure Android project files
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android --project-name=reader --org=com.selura .
            sed -i 's/android:label="reader"/android:label="Selura"/' android/app/src/main/AndroidManifest.xml
          fi
      - name: Verify Android application identity
        run: |
          ANDROID_GRADLE_FILE="$(find android/app -maxdepth 1 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | head -n 1)"
          test -n "$ANDROID_GRADLE_FILE"
          grep -q 'com.selura.reader' "$ANDROID_GRADLE_FILE"
          if grep -q 'com.selura.selura_reader' "$ANDROID_GRADLE_FILE"; then
            echo 'Legacy application ID is still present.' >&2
            exit 1
          fi
          grep -Rqs '^package com.selura.reader' android/app/src/main/kotlin android/app/src/main/java
          grep -q 'android:label="Selura"' android/app/src/main/AndroidManifest.xml
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: selura-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  persist-android:
    name: Persist Android scaffold
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/android-app-identity'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Commit generated Android project if missing
        run: |
          if git ls-files --error-unmatch android/app/build.gradle.kts >/dev/null 2>&1 || \
             git ls-files --error-unmatch android/app/build.gradle >/dev/null 2>&1; then
            echo 'Android scaffold is already tracked.'
            exit 0
          fi

          flutter create --platforms=android --project-name=reader --org=com.selura .
          sed -i 's/android:label="reader"/android:label="Selura"/' android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android
          if git diff --cached --quiet; then
            echo 'No Android scaffold changes to commit.'
            exit 0
          fi
          git commit -m 'Persist Android project scaffold'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  release:
    name: Publish direct APK
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: selura-debug-apk
          path: release
      - name: Rename APK
        run: mv release/app-debug.apk release/selura-debug.apk
      - name: Publish direct-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="test-pr-${{ github.event.pull_request.number }}"
            TITLE="Selura Test PR #${{ github.event.pull_request.number }}"
            NOTES="Direct-install test APK for Pull Request #${{ github.event.pull_request.number }}. Built by GitHub Actions run #${{ github.run_number }}."
            gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && \
              gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          else
            TAG="dev-${{ github.run_number }}"
            TITLE="Selura Development Build #${{ github.run_number }}"
            NOTES="Direct-install Selura Android APK generated from main by GitHub Actions."
          fi

          gh release create "$TAG" \
            "release/selura-debug.apk#Selura Debug APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease
