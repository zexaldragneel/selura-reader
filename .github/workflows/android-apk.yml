name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=selura_reader --org=com.selura .
      - name: Set stable Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          if not gradle.exists():
              gradle = Path('android/app/build.gradle')
          if not gradle.exists():
              raise SystemExit('Android Gradle app configuration not found')

          content = gradle.read_text()
          original = content
          content = content.replace('com.selura.selura_reader', 'com.selura.reader')
          if content == original or 'com.selura.reader' not in content:
              raise SystemExit('Expected generated Android package ID not found')
          gradle.write_text(content)

          # Flutter's generated MainActivity retains its original Kotlin package.
          # Resolve it explicitly so the new namespace does not break launch.
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          if 'android:name=".MainActivity"' not in content:
              raise SystemExit('Expected MainActivity declaration not found')
          manifest.write_text(content.replace(
              'android:name=".MainActivity"',
              'android:name="com.selura.selura_reader.MainActivity"',
          ))
          PY
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: selura-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish direct APK
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: selura-debug-apk
          path: release
      - name: Rename APK
        run: mv release/app-debug.apk release/selura-debug.apk
      - name: Publish direct-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="test-pr-${{ github.event.pull_request.number }}"
            TITLE="Selura Test PR #${{ github.event.pull_request.number }}"
            NOTES="Direct-install test APK for Pull Request #${{ github.event.pull_request.number }}. Built by GitHub Actions run #${{ github.run_number }}."
            gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && \
              gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          else
            TAG="dev-${{ github.run_number }}"
            TITLE="Selura Development Build #${{ github.run_number }}"
            NOTES="Direct-install Selura Android APK generated from main by GitHub Actions."
          fi

          gh release create "$TAG" \
            "release/selura-debug.apk#Selura Debug APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease
