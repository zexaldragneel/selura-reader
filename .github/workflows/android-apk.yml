name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=selura_reader --org=com.selura .
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: selura-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish direct APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: selura-debug-apk
          path: release
      - name: Rename APK
        run: mv release/app-debug.apk release/selura-debug.apk
      - name: Publish direct-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "dev-${{ github.run_number }}" \
            "release/selura-debug.apk#Selura Debug APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Selura Development Build #${{ github.run_number }}" \
            --notes "Direct-install Selura Android APK generated by GitHub Actions." \
            --prerelease
