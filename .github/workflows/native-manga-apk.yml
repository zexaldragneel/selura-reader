name: Seiryn Native Manga APK

on:
  pull_request:
    branches: [main, feature/selura-native-manga-migration, feature/selura-app-update-prompt, feature/selura-background-nhentai-copy, feature/selura-in-app-apk-installer, feature/selura-native-reader-reliability, feature/selura-extension-store-shortcut, feature/selura-premium-library-themes, feature/selura-xianxia-theme-polish, feature/selura-xianxia-v3-1, feature/selura-download-network-recovery, feature/selura-detailed-update-changelog, feature/selura-chapter-integrity-recovery, feature/selura-download-manager-retry-ui, feature/selura-download-failure-details, fix/selura-one-based-chapter-page-validation, feature/selura-readonly-download-health, fix/selura-health-cbz-reader, feature/selura-review-unfinished-transfers, feature/selura-remove-upstream-community-ui, feature/selura-safe-single-chapter-recovery, feature/seiryn-native-branding, feature/seiryn-reader-performance-v2-bounded-prefetch, feature/seiryn-reader-v2-webtoon-decode-memory, fix/seiryn-http503-preserve-chapter-auto-recovery-20261026, fix/seiryn-extension-manual-apk-rescan-20261026, feature/seiryn-storage-v2-unfinished-footprint-20261027]
    paths:
      - "native_manga/**"
      - ".github/workflows/native-manga-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selura-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snapshot:
    name: Preserve pinned Mihon engine inside Selura
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check for existing independent Selura source snapshot
        id: existing_source
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          ref: selura/mihon-v0.21.2-snapshot
          path: preserved-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify self-contained source mirror
        if: steps.existing_source.outcome == 'success'
        run: |
          set -euo pipefail
          test "$(git -C preserved-source rev-parse HEAD^{tree})" = "1ece370a126a3812966961ae65ff8553f5ac3ed4"
          git -C preserved-source log -1 --format=%B | grep -F "Upstream Mihon commit: 9612d955db3165e1578fdf9ff19ca9b7762c4a46"
          grep -q "Apache License" preserved-source/LICENSE
          echo "Building entirely from the saved Selura-owned engine, with no upstream GitHub dependency."

      - name: Checkout pinned Mihon source only for first-time snapshot
        if: steps.existing_source.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: mihonapp/mihon
          ref: 9612d955db3165e1578fdf9ff19ca9b7762c4a46
          path: upstream-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and preserve standalone source tree in Selura
        if: steps.existing_source.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SOURCE_DIR=upstream-source
          UPSTREAM_COMMIT=9612d955db3165e1578fdf9ff19ca9b7762c4a46
          UPSTREAM_TREE=b4bf371aaac2847aa46709810aad1409a6e51a45
          # Remove only Mihon's own CI workflows: GitHub's restricted Actions
          # token cannot introduce foreign workflow YAML into this repository.
          MIRROR_TREE=1ece370a126a3812966961ae65ff8553f5ac3ed4
          MIRROR_REF=refs/heads/selura/mihon-v0.21.2-snapshot
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD^{tree})" = "$UPSTREAM_TREE"
          grep -q "Apache License" "$SOURCE_DIR/LICENSE"
          git -C "$SOURCE_DIR" rm --cached -r -q .github/workflows
          test "$(git -C "$SOURCE_DIR" write-tree)" = "$MIRROR_TREE" || {
            echo "::error::Pinned Mihon source snapshot unexpectedly changed."
            exit 1
          }
          TARGET="https://github.com/${REPO}.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          EXISTING="$(git -C "$SOURCE_DIR" -c http.https://github.com/.extraheader="$AUTH_HEADER" ls-remote "$TARGET" "$MIRROR_REF" | cut -f1)"
          if [ -n "$EXISTING" ]; then
            git -C "$SOURCE_DIR" -c http.https://github.com/.extraheader="$AUTH_HEADER" fetch --depth=1 "$TARGET" "$MIRROR_REF"
            test "$(git -C "$SOURCE_DIR" rev-parse FETCH_HEAD^{tree})" = "$MIRROR_TREE" || {
              echo "::error::Existing Selura source mirror differs from pinned upstream. Manual review required."
              exit 1
            }
            echo "Existing Selura-owned source mirror has the verified full upstream tree."
          else
            # A new root commit, with the entire upstream engine minus its workflows and no dependency
            # on Mihon's Git history. Original LICENSE and notices remain intact.
            SNAPSHOT="$(git -C "$SOURCE_DIR" -c user.name='Selura Source Snapshot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$MIRROR_TREE" -m "Preserve Mihon v0.21.2 source in Selura" -m "Upstream Mihon commit: $UPSTREAM_COMMIT; Apache-2.0 with original notices.")"
            test "$(git -C "$SOURCE_DIR" rev-parse "$SNAPSHOT^{tree}")" = "$MIRROR_TREE"
            git -C "$SOURCE_DIR" -c http.https://github.com/.extraheader="$AUTH_HEADER" push "$TARGET" "$SNAPSHOT:$MIRROR_REF"
            echo "Created independent Selura-owned source snapshot."
          fi

  build:
    needs: snapshot
    name: Compile native manga reader
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Selura migration scripts and permanent encrypted signing material
        uses: actions/checkout@v4

      - name: Test Selura patch contracts
        run: python3 -m unittest discover -s native_manga/tests -v

      - name: Checkout Selura-owned standalone Mihon source snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: selura/mihon-v0.21.2-snapshot
          path: native-upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Verify complete pinned source tree and original Apache-2.0 license
        run: |
          set -euo pipefail
          test "$(git -C native-upstream rev-parse HEAD^{tree})" = "1ece370a126a3812966961ae65ff8553f5ac3ed4"
          git -C native-upstream log -1 --format=%B | grep -F "Upstream Mihon commit: 9612d955db3165e1578fdf9ff19ca9b7762c4a46"
          grep -q "Apache License" native-upstream/LICENSE
          test -f native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/backup/restore/BackupRestorer.kt
          test -f native-upstream/app/src/main/java/eu/kanade/tachiyomi/extension/ExtensionManager.kt

      - name: Rebrand native Android fork without modifying extension and restore engines
        env:
          SELURA_NATIVE_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 native_manga/apply_branding.py native-upstream \
            --version-code "$((1000 + SELURA_NATIVE_VERSION_CODE))"
          python3 native_manga/optimize_reader.py native-upstream
          python3 native_manga/reader_performance_v2.py native-upstream
          python3 native_manga/webtoon_decode_memory_v2.py native-upstream
          python3 native_manga/apply_premium_themes.py native-upstream
          python3 native_manga/refine_premium_themes.py native-upstream
          python3 native_manga/xianxia_v2.py native-upstream
          python3 native_manga/xianxia_v3.py native-upstream
          python3 native_manga/recover_downloads.py native-upstream
          python3 native_manga/verify_chapter_downloads.py native-upstream
          # Regression for the user-reported 41/41 false failure:
          # Mihon's Page.number is 1-based and written filenames start at 001.
          grep -Fq 'get() = index + 1' native-upstream/source-api/src/main/kotlin/eu/kanade/tachiyomi/source/model/Page.kt
          grep -Fq 'format(Locale.ENGLISH, page.number)' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          grep -Fq 'return (1..downloadPageCount).all { pageNumber ->' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          python3 native_manga/download_manager_actions.py native-upstream
          python3 native_manga/download_failure_details.py native-upstream
          python3 native_manga/rate_limit_pause.py native-upstream
          python3 native_manga/sequential_cooldown.py native-upstream
          python3 native_manga/persisted_cooldown.py native-upstream
          python3 native_manga/http429_stage_diagnostics.py native-upstream
          python3 native_manga/http503_chapter_recovery.py native-upstream
          python3 native_manga/extension_local_rescan.py native-upstream
          python3 native_manga/http_cdn_host_diagnostics.py native-upstream
          python3 native_manga/check_download_health.py native-upstream
          python3 native_manga/review_unfinished_transfers.py native-upstream
          # Offline Storage Manager 2.0: bounded and read-only size reporting.
          # Must follow the existing storage-health and unfinished-transfer patches.
          python3 native_manga/storage_manager_v2_overview.py native-upstream
          python3 native_manga/remove_upstream_community_ui.py native-upstream
          python3 native_manga/safe_single_chapter_recovery.py native-upstream
          # Final user-facing Seiryn visual rebrand; package, source IDs, signer
          # and native updater endpoint remain unchanged for in-place installs.
          python3 native_manga/apply_seiryn_branding.py native-upstream
          grep -Fq 'suspend fun inspectUnfinishedChapter(' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/DownloadManager.kt
          grep -Fq 'canonicalDir + Downloader.TMP_DIR_SUFFIX' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/DownloadManager.kt
          grep -Fq 'selura_single_recovery_retry' native-upstream/app/src/main/java/eu/kanade/tachiyomi/ui/manga/MangaScreen.kt
          ! grep -Fq 'mangaDir.findFile(chapterDirname + TMP_DIR_SUFFIX)?.delete()' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          test -s native-upstream/app/src/main/res/values/selura_single_chapter_recovery_strings.xml
          grep -Fq 'painterResource(R.drawable.seiryn_brand_art)' native-upstream/app/src/main/java/eu/kanade/presentation/more/LogoHeader.kt
          grep -Fq 'android:icon="@drawable/seiryn_launcher_icon"' native-upstream/app/src/main/AndroidManifest.xml
          test -s native-upstream/app/src/main/res/drawable-nodpi/seiryn_brand_art.webp
          test -s native-upstream/app/src/main/res/drawable-nodpi/seiryn_launcher_icon.webp
          # Android 12+ uses the SplashScreen theme, not the application icon.
          grep -Fq 'windowSplashScreenAnimatedIcon">@drawable/seiryn_splash_icon</item>' native-upstream/app/src/main/res/values/themes.xml
          ! grep -Fq 'windowSplashScreenAnimatedIcon">@drawable/ic_mihon_splash</item>' native-upstream/app/src/main/res/values/themes.xml
          grep -Fq 'android:drawable="@drawable/seiryn_launcher_icon"' native-upstream/app/src/main/res/drawable/seiryn_splash_icon.xml
          grep -Fq 'android:theme="@style/Theme.Tachiyomi.SplashScreen"' native-upstream/app/src/main/AndroidManifest.xml
          grep -Fq 'title = "Seiryn"' native-upstream/app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt
          grep -Fq 'Add Seiryn extensions' native-upstream/app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsBrowseScreen.kt
          grep -Fq 'Seiryn update available' native-upstream/app/src/main/java/eu/kanade/tachiyomi/ui/main/SeluraStartupUpdateCheck.kt
          grep -Fq 'Developed by Zexal Dragneel' native-upstream/app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt
          grep -Fq 'OpenSourceLicensesScreen()' native-upstream/app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt
          ! grep -Fq 'https://mihon.app/privacy/' native-upstream/app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt
          ! grep -Fq 'facebook.com/mihonapp' native-upstream/app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt
          ! grep -Fq 'url = Constants.URL_DISCORD' native-upstream/app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt
          test -s native-upstream/LICENSE
          grep -Fq 'fun describeUnfinished(context: Context, queuedCount: Int)' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/SeluraDownloadHealth.kt
          grep -Fq 'object SeirynStorageOverview' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/SeirynStorageOverview.kt
          grep -Fq 'MAX_FILE_ENTRIES = 20000' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/SeirynStorageOverview.kt
          grep -Fq 'SeirynStorageOverview.scan(context, storagePreferences)' native-upstream/app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsDownloadScreen.kt
          grep -Fq 'seiryn_storage_overview_title' native-upstream/app/src/main/res/values/seiryn_storage_overview_strings.xml
          grep -Fq 'downloadManager.startDownloads()' native-upstream/app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsDownloadScreen.kt
          grep -Fq 'selura_recovery_warning' native-upstream/app/src/main/res/values/selura_download_health_strings.xml
          test -f native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/SeluraDownloadHealth.kt
          grep -q 'SeluraDownloadHealth.scan(context, storagePreferences)' native-upstream/app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsDownloadScreen.kt
          grep -q 'val root = base?.findFile("downloads")' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/SeluraDownloadHealth.kt
          grep -Fq 'chapter.archiveReader(context).use { reader ->' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/SeluraDownloadHealth.kt
          grep -Fq 'CheckState.UNVERIFIED -> {' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/SeluraDownloadHealth.kt
          ! grep -Fq 'ZipInputStream(' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/SeluraDownloadHealth.kt
          grep -q 'NetworkType.CONNECTED' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/DownloadWorker.kt
          grep -q 'DownloadWorker.cancel(context)' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/DownloadManager.kt
          grep -q 'isTransientDownloadFailure' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          grep -q 'Could not finalize downloaded chapter archive' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          grep -q 'selura_retry_chapter' native-upstream/app/src/main/res/menu/download_single.xml
          grep -q 'retryFailedDownloads' native-upstream/app/src/main/java/eu/kanade/tachiyomi/ui/download/DownloadQueueViewModel.kt
          grep -q 'isReadableChapterArchive' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          grep -q 'describeDownloadFailure' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          grep -Fq 'private fun requestRateLimitPause(error: Throwable, stage: String)' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          grep -Fq 'private fun requestServiceUnavailablePause(error: HttpException, stage: String)' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          grep -Fq 'Re-enumerate local packages before refreshing the remote store.' native-upstream/app/src/main/java/eu/kanade/tachiyomi/extension/ExtensionManager.kt
          grep -Fq 'seirynHttp503Attempts.incrementAndGet()' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          grep -Fq 'var sourceHost: String? = null' native-upstream/core/common/src/main/kotlin/eu/kanade/tachiyomi/network/HttpException.kt
          grep -Fq 'sourceHost = failureHost' native-upstream/core/common/src/main/kotlin/eu/kanade/tachiyomi/network/OkHttpExtensions.kt
          grep -Fq 'var retryAfterSeconds: Long? = null' native-upstream/core/common/src/main/kotlin/eu/kanade/tachiyomi/network/HttpException.kt
          grep -Fq 'header("Retry-After")?.trim()?.toLongOrNull()' native-upstream/core/common/src/main/kotlin/eu/kanade/tachiyomi/network/OkHttpExtensions.kt
          grep -Fq 'val slots = Semaphore(1)' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          grep -Fq 'job.join()' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          grep -Fq 'DownloadWorker.scheduleRateLimitResume(context, minutes)' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          grep -Fq 'require(minutes in 1L..1440L)' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/DownloadWorker.kt
          grep -Fq '.setInitialDelay(minutes, TimeUnit.MINUTES)' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/DownloadWorker.kt
          grep -Fq 'downloader.cancelRateLimitAutoResume()' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/DownloadManager.kt
          grep -Fq 'compareAndSet(false, true)' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/Downloader.kt
          grep -q 'selura_view_download_error' native-upstream/app/src/main/java/eu/kanade/tachiyomi/ui/download/DownloadHolder.kt
          grep -q 'var failureReason: String?' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/download/model/Download.kt
          test -s native-upstream/app/src/main/res/drawable-nodpi/xianxia_header.webp
          grep -q 'xianxiaCardArtFrame' native-upstream/app/src/main/java/eu/kanade/presentation/library/components/CommonMangaItem.kt
          ! grep -q PremiumLibraryProgress native-upstream/app/src/main/java/eu/kanade/presentation/library/components/CommonMangaItem.kt
          test -s native-upstream/app/src/main/java/eu/kanade/presentation/theme/SeluraSkylineHeader.kt
          ! grep -q PremiumLibraryProgress native-upstream/app/src/main/java/eu/kanade/presentation/library/components/CommonMangaItem.kt
          grep -q 'seluraColorScheme' native-upstream/app/src/main/java/eu/kanade/presentation/theme/TachiyomiTheme.kt
          grep -q 'Library theme' native-upstream/app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsAppearanceScreen.kt
          grep -q 'applicationId = "com.selura.manga"' native-upstream/app/build.gradle.kts
          grep -q 'PARAMETER_CACHE_SIZE = 192L \* 1024 \* 1024' \
            native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/cache/ChapterCache.kt
          grep -q 'withOneTransientRetry' \
            native-upstream/app/src/main/java/eu/kanade/tachiyomi/ui/reader/loader/HttpPageLoader.kt
          grep -Fq 'boundedWebtoonDecodeSampleSize(' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/coil/ImageDecoder.kt
          grep -Fq 'MAX_TEMP_WEBTOON_PAGE_BYTES = 96L * 1024 * 1024' native-upstream/app/src/main/java/eu/kanade/tachiyomi/data/coil/ImageDecoder.kt
          grep -Fq 'private const val MAX_PAGES_AHEAD = 8' \
            native-upstream/app/src/main/java/eu/kanade/tachiyomi/ui/reader/loader/HttpPageLoader.kt
          grep -Fq 'pages.loadByRollingChunked(page.index, 2, 3)' \
            native-upstream/app/src/main/java/eu/kanade/tachiyomi/ui/reader/loader/HttpPageLoader.kt
          ! grep -Fq 'items.subList(index + 2, items.size)' \
            native-upstream/app/src/main/java/eu/kanade/tachiyomi/ui/reader/loader/HttpPageLoader.kt
          grep -q '<string name="app_name" translatable="false">Seiryn</string>' \
            native-upstream/i18n/src/commonMain/moko-resources/base/strings.xml

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure native Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Unlock Selura permanent signing certificate
        env:
          SELURA_SIGNING_PASSWORD: ${{ secrets.SELURA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SELURA_SIGNING_PASSWORD}" ]; then
            echo "::error::SELURA_SIGNING_PASSWORD secret is required."
            exit 1
          fi
          test -s android/signing/selura-release.jks.asc
          umask 077
          mkdir -p "$RUNNER_TEMP/selura-native-signing"
          printf '%s' "$SELURA_SIGNING_PASSWORD" |
            gpg --batch --yes --quiet --pinentry-mode loopback \
              --passphrase-fd 0 --decrypt \
              --output "$RUNNER_TEMP/selura-native-signing/selura-release.jks" \
              android/signing/selura-release.jks.asc
          keytool -list \
            -keystore "$RUNNER_TEMP/selura-native-signing/selura-release.jks" \
            -alias selura-release -storepass:env SELURA_SIGNING_PASSWORD >/dev/null
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=selura-release\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/selura-native-signing/selura-release.jks" \
            "$SELURA_SIGNING_PASSWORD" "$SELURA_SIGNING_PASSWORD" \
            > native-upstream/keystore.properties

      - name: Build native Android release APK from Mihon engine
        working-directory: native-upstream
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Local distribution excludes upstream telemetry and upstream updater.
          ./gradlew :app:assembleRelease --stacktrace --no-daemon \
            -Pdist=local -Pinclude-telemetry=false -Penable-updater=false

      - name: Verify signed native app identity, version and certificate
        env:
          EXPECTED_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK=native-upstream/app/build/outputs/apk/release/app-universal-release.apk
          test -s "$APK"
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_PATH/build-tools" -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_PATH/build-tools" -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/selura-manga-certificate.txt"
          grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/selura-manga-certificate.txt"
          grep -F 'certificate SHA-256 digest: da9cfd25f9b1c694b585d427e5faa8c9a1d052b8d846051fbe1569d65c851d42' \
            "$RUNNER_TEMP/selura-manga-certificate.txt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/selura-manga-manifest.txt"
          grep -m1 -F "package: name='com.selura.manga' versionCode='$((1000 + EXPECTED_VERSION))'" \
            "$RUNNER_TEMP/selura-manga-manifest.txt"
          echo "Verified native manga package, in-place upgrade version and original signing key."
          sha256sum "$APK"

      - name: Upload signed manga APK
        uses: actions/upload-artifact@v4
        with:
          name: selura-native-manga-apk
          path: native-upstream/app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error

      - name: Securely erase decrypted signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/selura-native-signing"
          rm -f native-upstream/keystore.properties

  release:
    name: Publish Seiryn direct download
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Selura update manifest generator
        uses: actions/checkout@v4

      - name: Download signed native APK
        uses: actions/download-artifact@v4
        with:
          name: selura-native-manga-apk
          path: release

      - name: Name installation artifact
        run: mv release/app-universal-release.apk release/selura-manga.apk

      - name: Publish immutable signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="test-native-pr-${{ github.event.pull_request.number }}-run-${{ github.run_number }}"
          else
            TAG="test-native-dispatch-run-${{ github.run_number }}"
          fi
          gh release create "$TAG" \
            "release/selura-manga.apk#Seiryn Signed Native APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Seiryn Native Preview · Build #${{ github.run_number }}" \
            --notes "Based on Mihon v0.21.2 (Apache-2.0), with Seiryn display branding and the original com.selura.manga application ID. Supports original Mihon backup restore and Mihon-compatible extension engines. This installs separately from legacy Selura and Mihon; user Android verification required. Preserve upstream attribution." \
            --prerelease

      - name: Generate safe version metadata from verified signed APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="test-native-pr-${{ github.event.pull_request.number }}-run-${{ github.run_number }}"
          else
            TAG="test-native-dispatch-run-${{ github.run_number }}"
          fi
          # PR releases require human-reviewed release-specific changes.
          # A stacked PR must update release_notes.json for its own PR number.
          # Workflow dispatch without a PR continues with legacy notes.
          CHANGELOG_ARGS=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGELOG_ARGS=(--changes-file native_manga/selura_updater/release_notes.json)
          fi
          python3 native_manga/selura_updater/write_update_feed.py \
            --version-code "$((1000 + RUN_NUMBER))" \
            --tag "$TAG" \
            --apk release/selura-manga.apk \
            --output public-feed/updates/latest.json \
            "${CHANGELOG_ARGS[@]}"

      - name: Save update manifest as private artifact (public feed opt-in only)
        uses: actions/upload-artifact@v4
        with:
          name: selura-update-feed-private
          path: public-feed/updates/latest.json
          if-no-files-found: error

  publish_update_feed:
    name: Publish signed release metadata
    needs: release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout metadata-only branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published

      - name: Download verified APK version manifest
        uses: actions/download-artifact@v4
        with:
          name: selura-update-feed-private
          path: incoming

      - name: Validate release metadata and version increase
        id: validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source = Path("incoming/latest.json")
          if not source.is_file() or source.stat().st_size > 4000:
              raise SystemExit("Invalid public metadata file")
          data = json.loads(source.read_text(encoding="utf-8"))
          keys = {"schemaVersion", "applicationId", "versionCode", "versionName",
                  "notes", "releaseUrl", "sha256"}
          if "${{ github.event_name }}" == "pull_request":
              assert set(data) == keys | {"changes"}
              groups = data["changes"]
              assert set(groups) == {"added", "improved", "fixed"}
              assert all(
                  isinstance(groups[name], list) and len(groups[name]) <= 5
                  and all(isinstance(item, str) and 0 < len(item) <= 180 for item in groups[name])
                  for name in ("added", "improved", "fixed")
              )
              assert 1 <= sum(len(items) for items in groups.values()) <= 12
          else:
              assert set(data) == keys
          assert data["schemaVersion"] == 1
          assert data["applicationId"] == "com.selura.manga"
          assert type(data["versionCode"]) is int
          assert data["versionCode"] == 1000 + int(os.environ["GITHUB_RUN_NUMBER"])
          assert len(data["versionName"]) <= 60
          assert len(data["notes"]) <= 1200
          assert re.fullmatch("[a-fA-F0-9]{64}", data["sha256"])
          assert re.fullmatch(
              "https://github.com/zexaldragneel/selura-reader/releases/tag/"
              "test-native-(pr-[0-9]+|dispatch)-run-[0-9]+",
              data["releaseUrl"],
          )
          previous = Path("published/updates/latest.json")
          newer = not previous.exists() or data["versionCode"] > json.loads(
              previous.read_text(encoding="utf-8"),
          )["versionCode"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("publish=" + str(newer).lower() + "\n")
          print("Metadata validated; publishing newer release:", newer)
          PY

      - name: Publish only version metadata to public branch
        if: steps.validate.outputs.publish == 'true'
        working-directory: published
        run: |
          set -euo pipefail
          mkdir -p updates
          cp ../incoming/latest.json updates/latest.json
          git add -- updates/latest.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish verified Seiryn build $GITHUB_RUN_NUMBER metadata"
          git push origin HEAD:gh-pages

      - name: Confirm public metadata URL
        if: steps.validate.outputs.publish == 'true'
        run: |
          curl -fsSL --retry 3 --retry-delay 4 --max-time 20 \
            https://raw.githubusercontent.com/zexaldragneel/selura-reader/gh-pages/updates/latest.json \
            -o /tmp/selura-feed.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/selura-feed.json").read_text())
          assert data["applicationId"] == "com.selura.manga"
          print("Public feed reachable; versionCode:", data["versionCode"])
          PY
