name: Selura Source Extension APK

on:
  pull_request:
    branches: [main]
    paths:
      - "selura_sources/**"
      - ".github/workflows/selura-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selura-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build signed Selura NHentai.to source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Selura-owned adapter and signing material
        uses: actions/checkout@v4

      - name: Test Selura adapter contracts
        run: python3 -m unittest discover -s selura_sources/tests -v

      - name: Checkout pinned Apache-2.0 extension build framework
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          ref: ff521c17bb3e503c01e658e8fac00b60a95829f3
          path: source-deps
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source provenance and install Selura provider
        run: |
          set -euo pipefail
          test "$(git -C source-deps rev-parse HEAD)" = "ff521c17bb3e503c01e658e8fac00b60a95829f3"
          grep -q "Apache License" source-deps/LICENSE
          python3 selura_sources/apply_source.py source-deps
          grep -F 'name = "Selura NHentai.to"' source-deps/src/all/seluranhentaito/build.gradle.kts
          test -f source-deps/src/all/nhentaito/build.gradle.kts

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unlock permanent Selura signing key
        env:
          SELURA_SIGNING_PASSWORD: ${{ secrets.SELURA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SELURA_SIGNING_PASSWORD"
          test -s android/signing/selura-release.jks.asc
          umask 077
          printf '%s' "$SELURA_SIGNING_PASSWORD" |
            gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
              --decrypt --output source-deps/signingkey.jks \
              android/signing/selura-release.jks.asc
          keytool -list -keystore source-deps/signingkey.jks \
            -alias selura-release -storepass:env SELURA_SIGNING_PASSWORD >/dev/null

      - name: Compile independent Selura extension APK
        working-directory: source-deps
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          KEY_STORE_PASSWORD: ${{ secrets.SELURA_SIGNING_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SELURA_SIGNING_PASSWORD }}
          ALIAS: selura-release
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :src:all:seluranhentaito:assembleRelease --stacktrace --no-daemon

      - name: Verify unique signed package and certificate
        run: |
          set -euo pipefail
          APK="$(find source-deps/src/all/seluranhentaito/build/outputs/apk/release \
            -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK" && test -s "$APK"
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_PATH/build-tools" -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_PATH/build-tools" -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/source-signature.txt"
          grep -F 'certificate SHA-256 digest: da9cfd25f9b1c694b585d427e5faa8c9a1d052b8d846051fbe1569d65c851d42' \
            "$RUNNER_TEMP/source-signature.txt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/source-package.txt"
          grep -F "package: name='eu.kanade.tachiyomi.extension.all.seluranhentaito'" \
            "$RUNNER_TEMP/source-package.txt"
          sha256sum "$APK"
          mkdir -p release
          cp "$APK" release/selura-nhentaito.apk

      - name: Upload verified source APK
        uses: actions/upload-artifact@v4
        with:
          name: selura-nhentaito-source-apk
          path: release/selura-nhentaito.apk
          if-no-files-found: error

      - name: Remove decrypted signing key
        if: always()
        run: rm -f source-deps/signingkey.jks

  release:
    name: Publish source extension preview
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: selura-nhentaito-source-apk
          path: release
      - name: Publish independent Selura source APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="test-selura-source-pr-${{ github.event.pull_request.number }}-run-${{ github.run_number }}"
          else
            TAG="test-selura-source-dispatch-run-${{ github.run_number }}"
          fi
          gh release create "$TAG" \
            "release/selura-nhentaito.apk#Selura NHentai.to independently signed source extension" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Selura NHentai.to Pilot · Build #${{ github.run_number }}" \
            --notes "Separate first-party Selura NHentai.to test extension. Built from Selura-owned adapter plus pinned Apache-2.0 Keiyoushi build framework. No existing extension is overwritten. Must be installed and trusted by user; site and images require Android testing. For authorized adult users only. Preserve Keiyoushi attribution and original LICENSE." \
            --prerelease
